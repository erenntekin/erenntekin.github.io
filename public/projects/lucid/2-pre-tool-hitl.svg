<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <rect width="1200" height="750" fill="#0b0e14" />

  <g transform="translate(40, 30)">
    <!-- Header -->
    <rect width="1120" height="46" rx="6" fill="#141923" stroke="#232d3f" stroke-width="1" />
    <text x="24" y="28" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">LUCID PRE-TOOL SHIELD &amp; PARAMETER GATING</text>
    <text x="440" y="28" font-family="monospace" font-size="12" fill="#64748b">// ZERO-TRUST FUNCTION CALL INTERCEPTION BEFORE EXECUTION</text>
    <text x="960" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">ORACLE: CONFIRMED</text>

    <!-- Two-Panel Display -->
    <g transform="translate(0, 68)">
      
      <!-- Left Panel: Dangerous Action Intercepted (HITL Gate) -->
      <g transform="translate(0, 0)">
        <rect width="545" height="570" rx="6" fill="#101520" stroke="#1e293b" stroke-width="1" />
        <rect width="545" height="38" rx="4" fill="#182234" />
        <text x="20" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">1. CRITICAL FUNCTION INTERCEPTION (HITL GATE)</text>

        <g transform="translate(20, 56)" font-family="monospace" font-size="11">
          <!-- Adversarial Request -->
          <text y="16" fill="#94a3b8">// Adversarial prompt pushed agent to call destructive tool:</text>
          <rect y="26" width="505" height="58" rx="4" fill="#0d111a" stroke="#1f293d" />
          <text x="14" y="50" fill="#fca5a5" font-size="11.5">User Prompt: "Delete the account u_1002 right now."</text>
          <text x="14" y="70" fill="#94a3b8" font-size="10.5">Agent LLM Dispatch: delete_user_account(user_id="u_1002")</text>

          <!-- Pre-Execution Interception Banner -->
          <g transform="translate(0, 100)">
            <rect width="505" height="150" rx="4" fill="#1f1618" stroke="#7f1d1d" stroke-width="1.5" />
            <text x="16" y="26" font-weight="700" fill="#ef4444" font-size="12">PRE-EXECUTION INTERCEPTOR TRIGGERED</text>
            <text x="16" y="50" fill="#fca5a5">Target Function : delete_user_account()</text>
            <text x="16" y="72" fill="#fca5a5">Policy Category : SENSITIVE / DESTRUCTIVE</text>
            <text x="16" y="94" fill="#fca5a5">Required Token  : hitl_approved=True</text>
            <text x="16" y="116" fill="#fca5a5">Execution State : SUSPENDED (Zero DB modification)</text>
            <text x="16" y="136" font-weight="700" fill="#f87171">Verdict: VerdictAction.REQUIRE_HITL</text>
          </g>

          <!-- Synthesized Response to LLM -->
          <g transform="translate(0, 268)">
            <text y="16" fill="#94a3b8">// Synthetic error returned to model (avoids unhandled crash):</text>
            <rect y="26" width="505" height="60" rx="4" fill="#0d111a" stroke="#1e293b" />
            <text x="14" y="50" fill="#38bdf8" font-size="11">"Permission Denied: 'delete_user_account' requires human confirmation."</text>
            <text x="14" y="70" fill="#64748b" font-size="10.5">Model formulates safe explanation to user without executing deletion.</text>
          </g>

          <!-- Impact Metrics -->
          <g transform="translate(0, 370)">
            <rect width="505" height="100" rx="4" fill="#111827" stroke="#1e293b" />
            <text x="16" y="26" font-weight="700" fill="#34d399">DEFENSE IMPACT:</text>
            <text x="16" y="50" fill="#cbd5e1">• Unrestricted function calls: 0 allowed without confirmation.</text>
            <text x="16" y="70" fill="#cbd5e1">• SQLite database rows preserved: 100% intact.</text>
            <text x="16" y="90" fill="#38bdf8">• OWASP T1-03 &amp; T3-04 completely neutralized.</text>
          </g>
        </g>
      </g>

      <!-- Right Panel: Parameter Constraints & Type Confusion (T2-04) -->
      <g transform="translate(575, 0)">
        <rect width="545" height="570" rx="6" fill="#101520" stroke="#1e293b" stroke-width="1" />
        <rect width="545" height="38" rx="4" fill="#182234" />
        <text x="20" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">2. PARAMETER CONSTRAINTS &amp; TYPE CONFUSION</text>

        <g transform="translate(20, 56)" font-family="monospace" font-size="11">
          <text y="16" fill="#94a3b8">// Declarative parameter schemas enforced via Pydantic v2:</text>
          
          <!-- Schema Rule 1 -->
          <g transform="translate(0, 26)">
            <rect width="505" height="110" rx="4" fill="#0d111a" stroke="#1e293b" />
            <text x="14" y="24" font-weight="700" fill="#38bdf8">Rule: 'calories' -> type: int, min: 0, max: 10000</text>
            
            <text x="14" y="48" fill="#f87171">Payload: add_meal(calories=-500) -> BLOCKED (value &lt; min)</text>
            <text x="14" y="68" fill="#f87171">Payload: add_meal(calories=True) -> BLOCKED (bool type confusion)</text>
            <text x="14" y="88" fill="#f87171">Payload: add_meal(calories=99999) -> BLOCKED (value &gt; max)</text>
            <text x="14" y="104" fill="#34d399">Valid  : add_meal(calories=450) -> PERMITTED</text>
          </g>

          <!-- Schema Rule 2 -->
          <g transform="translate(0, 150)">
            <rect width="505" height="110" rx="4" fill="#0d111a" stroke="#1e293b" />
            <text x="14" y="24" font-weight="700" fill="#38bdf8">Rule: 'user_id' -> type: str, pattern: ^u_\d+$</text>
            
            <text x="14" y="48" fill="#f87171">Payload: get_profile(user_id="*") -> BLOCKED (regex mismatch)</text>
            <text x="14" y="68" fill="#f87171">Payload: get_profile(user_id="u_admin' OR 1=1--") -> BLOCKED</text>
            <text x="14" y="88" fill="#f87171">Payload: get_profile(user_id=1001) -> BLOCKED (expected string)</text>
            <text x="14" y="104" fill="#34d399">Valid  : get_profile(user_id="u_1001") -> PERMITTED</text>
          </g>

          <!-- Denylist Block -->
          <g transform="translate(0, 274)">
            <rect width="505" height="90" rx="4" fill="#18131d" stroke="#581c87" />
            <text x="14" y="24" font-weight="700" fill="#c084fc">Rule: 'blocked_tools' -> Denylist [execute_shell_command, eval_python]</text>
            <text x="14" y="48" fill="#f87171">Payload: execute_shell_command(command="whoami") -> HARD REJECT</text>
            <text x="14" y="68" fill="#f87171">Payload: register_dynamic_tool(...) -> HARD REJECT</text>
            <text x="14" y="84" fill="#34d399">Neutralizes OWASP T4-05 (Arbitrary Shell Execution)</text>
          </g>

          <!-- Summary Metric -->
          <g transform="translate(0, 380)">
            <rect width="505" height="90" rx="4" fill="#111827" stroke="#1e293b" />
            <text x="16" y="24" font-weight="700" fill="#34d399">LATENCY &amp; COMPUTATION:</text>
            <text x="16" y="46" fill="#cbd5e1">• Validation Overhead: &lt; 0.2 milliseconds per parameter.</text>
            <text x="16" y="66" fill="#cbd5e1">• Execution Model: 100% deterministic local Python (0 LLM cost).</text>
            <text x="16" y="84" fill="#38bdf8">• False positive rate: 0.0% on valid application calls.</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
