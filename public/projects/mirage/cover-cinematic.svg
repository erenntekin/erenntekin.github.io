<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="deepDark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#120609" />
      <stop offset="55%" stop-color="#080a0e" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Center Crimson Aura -->
    <radialGradient id="redAura" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#991b1b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Horizontal Scanning Beam -->
    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0" />
      <stop offset="25%" stop-color="#dc2626" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#dc2626" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter for Main Text -->
    <filter id="neonRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#dc2626" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#deepDark)" />
  <rect width="1200" height="675" fill="url(#tacticalGrid)" />
  <rect width="1200" height="675" fill="url(#redAura)" />

  <!-- Corner Brackets (Tactical HUD) -->
  <g stroke="#dc2626" stroke-opacity="0.4" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 48 76 L 48 48 L 76 48" />
    <!-- Top-Right -->
    <path d="M 1124 48 L 1152 48 L 1152 76" />
    <!-- Bottom-Left -->
    <path d="M 48 599 L 48 627 L 76 627" />
    <!-- Bottom-Right -->
    <path d="M 1124 627 L 1152 627 L 1152 599" />
  </g>

  <!-- Micro HUD Header -->
  <g font-family="monospace" font-size="11" letter-spacing="3" fill="#64748b">
    <text x="64" y="58" fill="#ef4444" fill-opacity="0.8">// THREAT_LEVEL: CRITICAL</text>
    <text x="1136" y="58" text-anchor="end">SYS_SCAN // OWASP LLM-10</text>
  </g>

  <!-- Reticle / Target Elements -->
  <circle cx="600" cy="320" r="160" stroke="#dc2626" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="600" cy="320" r="230" stroke="#dc2626" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Subtle Crosshairs -->
  <line x1="600" y1="130" x2="600" y2="180" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="600" y1="460" x2="600" y2="510" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="370" y1="320" x2="420" y2="320" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="780" y1="320" x2="830" y2="320" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Center Laser Line through Title -->
  <line x1="240" y1="320" x2="960" y2="320" stroke="url(#scanBeam)" stroke-width="1.5" />

  <!-- Main Center Title: MIRAGE -->
  <text 
    x="600" 
    y="346" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
    font-size="86" 
    font-weight="900" 
    letter-spacing="18" 
    fill="#f87171" 
    filter="url(#neonRed)"
  >MIRAGE</text>

  <!-- Subtitle -->
  <text 
    x="600" 
    y="404" 
    text-anchor="middle" 
    font-family="monospace" 
    font-size="13" 
    font-weight="600" 
    letter-spacing="6" 
    fill="#fca5a5" 
    fill-opacity="0.85"
  >OFFENSIVE AI AGENT SECURITY SCANNER</text>

  <!-- Bottom Badges / Metrics -->
  <g font-family="monospace" font-size="11" letter-spacing="2" fill="#94a3b8">
    <text x="64" y="620">PROBES: 19/19 CONFIRMED</text>
    <text x="600" y="620" text-anchor="middle" fill="#ef4444" fill-opacity="0.9">ORACLES: TRIPLE-TIER EXECUTION</text>
    <text x="1136" y="620" text-anchor="end">STATUS: READY</text>
  </g>
</svg>
