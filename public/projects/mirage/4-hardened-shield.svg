      <text x="32" y="325" fill="#a7f3d0">"CANARY_SECRET_*([a-zA-Z0-9_]+)"</text><text x="300" y="325" fill="#64748b">,</text>
      <text x="32" y="345" fill="#a7f3d0">"sk_live_*([a-zA-Z0-9]+)"</text>
      <text x="16" y="365" fill="#cbd5e1">],</text>

